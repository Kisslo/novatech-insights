name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked python -m pytest

  sql-tests:
    name: PostgreSQL tests (${{ matrix.pgvector_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        pgvector_tag:
          - "0.8.2-pg17"
          - "pg17"

    services:
      postgres:
        image: pgvector/pgvector:${{ matrix.pgvector_tag }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: novatech_test
        options: >-
          --health-cmd "pg_isready -U postgres -d novatech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply migrations 001–005 to empty test database
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in \
            sql/001_create_news.sql \
            sql/002_create_topic_storage.sql \
            sql/003_create_topics_and_links.sql \
            sql/004_create_topic_read_views.sql \
            sql/005_save_topic_group.sql
          do
            echo "Applying $migration"
            docker exec -i "$TEST_CONTAINER" \
              psql -X -U postgres -d novatech_test \
              -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Report database versions
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$TEST_CONTAINER" \
            psql -X -U postgres -d novatech_test \
            -v ON_ERROR_STOP=1 \
            -c "SELECT current_setting('server_version') AS postgres_version, extversion AS vector_version FROM pg_extension WHERE extname = 'vector';"

      - name: Run SQL assertions in plain PostgreSQL
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for test_file in \
            sql/test_topic_counts.sql \
            sql/test_topic_constraints.sql \
            sql/test_topic_selection.sql \
            sql/test_topic_permissions.sql \
            sql/test_save_topic_group.sql
          do
            echo "Running $test_file"
            docker exec -i "$TEST_CONTAINER" \
              psql -X -U postgres -d novatech_test \
              -v ON_ERROR_STOP=1 < "$test_file"
          done

      - name: Prepare Supabase-style permission test database
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$TEST_CONTAINER" \
            createdb -U postgres novatech_permissions_test

          docker exec -i "$TEST_CONTAINER" \
            psql -X -U postgres -d novatech_permissions_test \
            -v ON_ERROR_STOP=1 < sql/setup_supabase_permission_test.sql

      - name: Apply migrations 001–005 with automatic grants
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in \
            sql/001_create_news.sql \
            sql/002_create_topic_storage.sql \
            sql/003_create_topics_and_links.sql \
            sql/004_create_topic_read_views.sql \
            sql/005_save_topic_group.sql
          do
            echo "Applying $migration"
            docker exec -i "$TEST_CONTAINER" \
              psql -X -U postgres -d novatech_permissions_test \
              -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Check automatic grants before backend permissions
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$TEST_CONTAINER" \
            psql -X -U postgres -d novatech_permissions_test \
            -v ON_ERROR_STOP=1 < sql/test_supabase_default_permissions.sql

      - name: Run SQL assertions with Supabase-style defaults
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for test_file in \
            sql/test_topic_counts.sql \
            sql/test_topic_constraints.sql \
            sql/test_topic_selection.sql \
            sql/test_topic_permissions.sql \
            sql/test_save_topic_group.sql
          do
            echo "Running $test_file"
            docker exec -i "$TEST_CONTAINER" \
              psql -X -U postgres -d novatech_permissions_test \
              -v ON_ERROR_STOP=1 < "$test_file"
          done

      - name: Apply backend permissions and test both databases
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Roles created by the setup script are shared by both databases.
          for test_database in novatech_test novatech_permissions_test
          do
            echo "Applying backend permissions to $test_database"
            docker exec -i "$TEST_CONTAINER" \
              psql -X -U postgres -d "$test_database" \
              -v ON_ERROR_STOP=1 < sql/006_topic_backend_permissions.sql

            echo "Testing backend permissions in $test_database"
            docker exec -i "$TEST_CONTAINER" \
              psql -X -U postgres -d "$test_database" \
              -v ON_ERROR_STOP=1 < sql/test_topic_backend_permissions.sql
          done