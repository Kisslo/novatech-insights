
[project]
name = "novatech-insights"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
# Lets tests import the scripts' shared helpers as `content_tools`,
# the same way the scripts do when run as `python src/<script>.py`.
pythonpath = ["src"]
# Only collect tests from tests/, not local files elsewhere (e.g. output/).
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
